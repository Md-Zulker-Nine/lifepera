name: Publish generated blog post

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      intent:
        description: Reader need or topic brief for a published article
        required: true
        type: string
      category:
        description: Editorial category
        required: false
        type: string
      keywords:
        description: Reader questions or specific angles to cover
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-publishing
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select scheduled reader intent
        id: topic
        if: github.event_name == 'schedule'
        run: node scripts/select-blog-topic.js

      - name: Generate and publish post
        if: github.event_name != 'schedule' || steps.topic.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_INTENT: ${{ github.event_name == 'schedule' && steps.topic.outputs.intent || inputs.intent }}
          BLOG_CATEGORY: ${{ github.event_name == 'schedule' && steps.topic.outputs.category || inputs.category }}
          BLOG_KEYWORDS: ${{ github.event_name == 'schedule' && steps.topic.outputs.keywords || inputs.keywords }}
        run: node scripts/generate-blog-post.js

      - name: Update blog listing and sitemap
        if: github.event_name != 'schedule' || steps.topic.outputs.run == 'true'
        run: |
          node scripts/build-blog-listing.js
          node scripts/generate-sitemap.js

      - name: Publish website changes
        if: github.event_name != 'schedule' || steps.topic.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog blog-index.json blog.html sitemap.xml
          git diff --cached --quiet && { echo "No generated website changes to publish."; exit 1; }
          git commit -m "Publish scheduled blog post"
          git push
